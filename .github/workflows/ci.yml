name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.distro }} ${{ matrix.arch }} ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        distro: [alpine, ubuntu, debian]
        arch: [amd64, arm64]
        variant: [release, debug, static, shared, asan, tsan, ubsan, msan]
        exclude:
          - distro: alpine
            variant: tsan
          - distro: alpine
            variant: msan
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/zen0x7/bcompiler:latest-${{ matrix.variant }}-${{ matrix.distro }}-${{ matrix.arch }}
      options: --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout ${{ github.sha }}
        shell: bash

      - name: Map variant
        id: args
        run: |
          case ${{ matrix.variant }} in
            release) echo "build_type=Release" >> "$GITHUB_OUTPUT"; echo "static=OFF"       >> "$GITHUB_OUTPUT"; echo "sanitizer=OFF" >> "$GITHUB_OUTPUT"; echo "compiler="      >> "$GITHUB_OUTPUT" ;;
            debug)   echo "build_type=Debug"   >> "$GITHUB_OUTPUT"; echo "static=ON"        >> "$GITHUB_OUTPUT"; echo "sanitizer=OFF" >> "$GITHUB_OUTPUT"; echo "compiler="      >> "$GITHUB_OUTPUT" ;;
            static)  echo "build_type=Release" >> "$GITHUB_OUTPUT"; echo "static=ON"        >> "$GITHUB_OUTPUT"; echo "sanitizer=OFF" >> "$GITHUB_OUTPUT"; echo "compiler="      >> "$GITHUB_OUTPUT" ;;
            shared)  echo "build_type=Debug"   >> "$GITHUB_OUTPUT"; echo "static=OFF"       >> "$GITHUB_OUTPUT"; echo "sanitizer=OFF" >> "$GITHUB_OUTPUT"; echo "compiler="      >> "$GITHUB_OUTPUT" ;;
            asan)    echo "build_type=Release" >> "$GITHUB_OUTPUT"; echo "static=OFF"       >> "$GITHUB_OUTPUT"; echo "sanitizer=ASAN" >> "$GITHUB_OUTPUT"; echo "compiler=clang" >> "$GITHUB_OUTPUT" ;;
            tsan)    echo "build_type=Release" >> "$GITHUB_OUTPUT"; echo "static=OFF"       >> "$GITHUB_OUTPUT"; echo "sanitizer=TSAN" >> "$GITHUB_OUTPUT"; echo "compiler=clang" >> "$GITHUB_OUTPUT" ;;
            ubsan)   echo "build_type=Release" >> "$GITHUB_OUTPUT"; echo "static=OFF"       >> "$GITHUB_OUTPUT"; echo "sanitizer=UBSAN" >> "$GITHUB_OUTPUT"; echo "compiler=clang" >> "$GITHUB_OUTPUT" ;;
            msan)    echo "build_type=Release" >> "$GITHUB_OUTPUT"; echo "static=OFF"       >> "$GITHUB_OUTPUT"; echo "sanitizer=MSAN" >> "$GITHUB_OUTPUT"; echo "compiler=clang" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure
        run: |
          SANITIZER_ARG=""
          if [ "${{ steps.args.outputs.sanitizer }}" != "OFF" ]; then
            SANITIZER_ARG="-DENABLE_${{ steps.args.outputs.sanitizer }}=ON"
          fi
          COMPILER_ARGS=""
          if [ "${{ steps.args.outputs.compiler }}" = "clang" ]; then
            COMPILER_ARGS="-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++"
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ steps.args.outputs.build_type }} \
            -DENABLE_STATIC_LINKING=${{ steps.args.outputs.static }} \
            ${COMPILER_ARGS} \
            ${SANITIZER_ARG} \
            -DENABLE_BUILD_TESTS=ON \
            -DENABLE_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build -j4

      - name: Test
        run: |
          ctest --test-dir build -j4 --output-on-failure
